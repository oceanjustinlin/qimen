{
  "schema_version": "ziwei-rules/v1",
  "rules": [
    {
      "id": "rule.flow.month.v1",
      "name": "斗君宫起流月",
      "rule_type": "calculation",
      "school": "sanhe-core",
      "scope": "monthly",
      "status": "reviewed",
      "priority": 90,
      "inputs": [
        "yearly_doujun_palace_index",
        "target_lunar_month"
      ],
      "when": {
        "all": [
          {
            "fact": "yearly_doujun_palace_index",
            "operator": "between",
            "value": [0, 11]
          },
          {
            "fact": "target_lunar_month",
            "operator": "between",
            "value": [1, 12]
          }
        ]
      },
      "derive": {
        "fact": "flow_month_palace_index",
        "operator": "palace_offset",
        "arguments": {
          "start": "yearly_doujun_palace_index",
          "forward": [
            {
              "input": "target_lunar_month",
              "subtract": 1
            }
          ],
          "modulus": 12
        }
      },
      "evidence": [
        "source.mingli-tianji.p408.doujun",
        "source.feixing-ziwei.p127.doujun"
      ],
      "confidence": "high",
      "risk": "low"
    },
